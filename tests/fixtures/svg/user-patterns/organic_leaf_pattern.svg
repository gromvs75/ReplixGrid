<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Organic Pattern of Leaf Shapes with Clean Cutouts for 3D Printing -->
  <g fill="#2d5a27">
    <!-- Leaf 1 (Center Large) -->
    <path d="M 200,80 C 290,120 310,250 200,320 C 90,250 110,120 200,80 Z M 190,140 L 140,240 L 155,247 L 205,147 Z M 210,140 L 260,240 L 245,247 L 195,147 Z" />
    
    <!-- Leaf 2 (Top Left) -->
    <path d="M 100,50 C 160,80 170,160 100,210 C 30,160 40,80 100,50 Z M 95,90 L 60,160 L 70,165 L 105,95 Z" transform="rotate(-15 100 50)" />
    
    <!-- Leaf 3 (Top Right) -->
    <path d="M 300,50 C 360,80 370,160 300,210 C 230,160 240,80 300,50 Z M 305,90 L 340,160 L 330,165 L 295,95 Z" transform="rotate(15 300 50)" />
    
    <!-- Leaf 4 (Bottom Left) -->
    <path d="M 110,240 C 170,270 180,350 110,400 C 40,350 50,270 110,240 Z M 105,280 L 70,350 L 80,355 L 115,285 Z" transform="rotate(-30 110 240)" />
    
    <!-- Leaf 5 (Bottom Right) -->
    <path d="M 290,240 C 350,270 360,350 290,400 C 220,350 230,270 290,240 Z M 295,280 L 330,350 L 320,355 L 285,285 Z" transform="rotate(30 290 240)" />
  </g>
</svg>